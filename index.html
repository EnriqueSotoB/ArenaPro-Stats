<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FMR Tour 2027 — ArenaPro Stats</title>
  <meta name="description" content="Clasificación de puntos y estadísticas del FMR Tour 2027 — ArenaPro Stats" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#temporada" aria-label="ArenaPro Stats — Temporada">
      <img src="assets/logo.svg" alt="" width="40" height="40" />
      <span class="brand-text">
        <span class="brand-name">ArenaPro</span>
        <span class="brand-sub">Stats</span>
      </span>
    </a>
    <nav class="nav" aria-label="Secciones">
      <button type="button" class="nav-link" data-nav="temporada" id="navTemporada">Temporada</button>
      <button type="button" class="nav-link" data-nav="eventos" id="navEventos">Eventos</button>
    </nav>
  </header>

  <main class="main">
    <p id="status" class="status" role="status"></p>

    <!-- TEMPORADA: hub por categoría -->
    <section id="viewTemporadaHub" class="view" hidden>
      <header class="page-head">
        <h1 id="tempTitle">Temporada</h1>
        <p id="tempMeta" class="meta"></p>
      </header>
      <div id="tempCards" class="card-grid"></div>
    </section>

    <!-- TEMPORADA: ranking completo de una categoría -->
    <section id="viewTemporadaRanking" class="view" hidden>
      <header class="page-head">
        <button type="button" class="btn-back" id="btnBackTemporada">← Temporada</button>
        <h1 id="rankTitle">Ranking</h1>
        <p id="rankMeta" class="meta"></p>
      </header>
      <div id="rankPodium" class="podium"></div>
      <div id="rankTable" class="panel"></div>
    </section>

    <!-- EVENTOS: índice -->
    <section id="viewEventosList" class="view" hidden>
      <header class="page-head">
        <h1>Eventos</h1>
        <p class="meta">Resultados por rodeo · elige uno para ver categorías</p>
      </header>
      <div id="eventosList" class="event-list"></div>
    </section>

    <!-- EVENTO: detalle -->
    <section id="viewEventoDetail" class="view" hidden>
      <header class="page-head">
        <button type="button" class="btn-back" id="btnBackEventos">← Eventos</button>
        <h1 id="eventoTitle">Evento</h1>
        <p id="eventoMeta" class="meta"></p>
      </header>
      <div id="eventoPodium" class="podium"></div>
      <div class="panel">
        <div id="catTabs" class="tabs" role="tablist" aria-label="Categorías"></div>
        <div id="eventoTable" class="tables"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Alimenta con <code>arenapro-results</code> de Time · datos en <code>data/</code></p>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
