name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código (ESLint)
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Instalar navegador para pruebas E2E
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (portada, ranking, búsqueda, eventos, portal, legales)
        run: npm run test:e2e
