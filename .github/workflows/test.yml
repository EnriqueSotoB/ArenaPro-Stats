name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "sprint/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar tests
        run: npm test
