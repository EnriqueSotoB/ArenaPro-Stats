name: Rebuild temporada

# Solo manual: el admin local (publicar.bat) ya regenera data/circuitos/.
# El commit automático en cada push chocaba con el siguiente "Publicar".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerar data/circuitos/
        run: node scripts/rebuild-temporada.mjs

      - name: Commit si hay cambios
        run: |
          git add -A -- data
          if git diff --cached --quiet -- data; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerar estadísticas por circuito"
          git push
