name: Rebuild temporada

on:
  push:
    branches: [main]
    paths:
      - "data/eventos/**"
      - "data/manifest.json"
      - "scripts/rebuild-temporada.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerar temporada.json
        run: node scripts/rebuild-temporada.mjs

      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- data/temporada.json; then
            echo "Sin cambios en temporada.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temporada.json
          git commit -m "chore: regenerar temporada.json"
          git push
