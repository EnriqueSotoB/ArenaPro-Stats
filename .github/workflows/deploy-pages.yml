name: Deploy Pages

# Publica el sitio solo si los tests y la revisión de datos pasan.
# Requiere Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  # Los commits que empuja otro workflow con GITHUB_TOKEN no disparan "push".
  workflow_run:
    workflows: ["Rebuild temporada"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar código (ESLint)
        run: npm run lint

      - name: Tests y revisión de datos
        run: npm test

      - name: Instalar navegador para pruebas E2E
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E del sitio armado
        run: npm run test:e2e

      - name: Armar sitio público
        run: node scripts/build-site.mjs "$(git rev-parse HEAD)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
